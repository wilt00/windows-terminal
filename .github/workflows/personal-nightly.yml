name: Personal nightly

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-nightly
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream branches
    runs-on: ubuntu-latest
    outputs:
      personal_sha: ${{ steps.metadata.outputs.personal_sha }}
      package_version: ${{ steps.metadata.outputs.package_version }}
    steps:
      - name: Check out personal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: personal
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror upstream main and update personal
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/microsoft/terminal.git 2>/dev/null || true
          git fetch upstream main

          # The fork's main branch is always exactly the upstream main commit.
          git push origin upstream/main:refs/heads/main --force

          # Feature branch tips remain stable. Personal receives upstream through merges.
          git checkout -B personal origin/personal
          git merge --no-edit upstream/main
          git push origin personal

          package_version="$(date -u +%y).$(date -u +%-m%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "personal_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

  build-test-release:
    name: Build, test, and publish x64
    needs: sync
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      PACKAGE_VERSION: ${{ needs.sync.outputs.package_version }}
      PERSONAL_SHA: ${{ needs.sync.outputs.personal_sha }}
      PFX_PASSWORD: ${{ secrets.NIGHTLY_SIGNING_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPECTED_SIGNING_THUMBPRINT: '9134032BFE82B08BB1B9401D2202F93DD26559F2'
      CL_MPCount: '2'
    steps:
      - name: Check out updated personal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync.outputs.personal_sha }}
          fetch-depth: 0
          submodules: true

      - name: Add 64-bit MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
        with:
          vs-version: '[17.0,19.0)'
          msbuild-architecture: x64

      - name: Restore persistent signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.NIGHTLY_SIGNING_PFX }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
              throw 'NIGHTLY_SIGNING_PFX and NIGHTLY_SIGNING_PASSWORD must be configured as repository secrets.'
          }
          $pfxPath = 'src/cascadia/CascadiaPackage/CascadiaPackage_TemporaryKey.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxPath, $env:PFX_PASSWORD, $flags)
          if ($cert.Subject -ne 'CN=wilt00' -or $cert.Thumbprint -ne $env:EXPECTED_SIGNING_THUMBPRINT) {
              throw "Unexpected signing certificate: $($cert.Subject), $($cert.Thumbprint)"
          }
          New-Item artifacts/release -ItemType Directory -Force | Out-Null
          $cerPath = 'artifacts/release/WindowsTerminalPersonal.cer'
          [IO.File]::WriteAllBytes(
              $cerPath,
              $cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          # TrustedPeople permits MSIX installation without prompting to trust a root CA.
          Import-Certificate -FilePath $cerPath -CertStoreLocation 'Cert:\CurrentUser\TrustedPeople' | Out-Null

      - name: Set package version and generate notices
        shell: pwsh
        run: |
          $latestRelease = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=1" | ConvertFrom-Json
          if ($latestRelease) {
              $previousVersion = [version]($latestRelease[0].tag_name -replace '^nightly-v', '')
              if ([version]$env:PACKAGE_VERSION -le $previousVersion) {
                  throw "Package version $env:PACKAGE_VERSION must be greater than released version $previousVersion."
              }
          }

          $manifestPath = 'src/cascadia/CascadiaPackage/Package-Dev.appxmanifest'
          [xml]$manifest = Get-Content $manifestPath
          $manifest.Package.Identity.Version = $env:PACKAGE_VERSION
          $manifest.Save((Resolve-Path $manifestPath))
          ./build/scripts/Generate-ThirdPartyNotices.ps1 `
              -MarkdownNoticePath ./NOTICE.md `
              -OutputPath ./src/cascadia/CascadiaPackage/NOTICE.html

      - name: Configure vcpkg
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsRoot = & $vswhere -latest -prerelease -products * -requires Microsoft.VisualStudio.Component.Vcpkg -property installationPath
          if ($vsRoot -and (Test-Path "$vsRoot/VC/vcpkg/vcpkg.exe")) {
              $vcpkgRoot = "$vsRoot/VC/vcpkg"
          } else {
              git clone --depth 1 https://github.com/microsoft/vcpkg.git dep/vcpkg
              ./dep/vcpkg/bootstrap-vcpkg.bat -disableMetrics
              $vcpkgRoot = (Resolve-Path dep/vcpkg).Path
          }
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          ./dep/nuget/nuget.exe restore OpenConsole.slnx -NonInteractive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./dep/nuget/nuget.exe restore dep/nuget/packages.config -PackagesDirectory packages -NonInteractive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./dep/nuget/nuget.exe restore build/packages.config -PackagesDirectory packages -NonInteractive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build/scripts/Set-LatestVCToolsVersion.ps1

      - name: Build Release package and TerminalCore tests
        shell: pwsh
        run: |
          $appxPackageDir = Join-Path (Resolve-Path .).Path 'artifacts\AppPackages'
          New-Item $appxPackageDir -ItemType Directory -Force | Out-Null
          $arguments = @(
              'OpenConsole.slnx',
              '/t:Terminal\CascadiaPackage;Terminal\Tests\UnitTests',
              '/p:Configuration=Release',
              '/p:Platform=x64',
              '/p:WindowsTerminalOfficialBuild=true',
              '/p:WindowsTerminalBranding=Dev',
              '/p:GenerateAppxPackageOnBuild=true',
              '/p:AppxBundle=Never',
              '/p:UapAppxPackageBuildMode=SideloadOnly',
              '/p:AppxSymbolPackageEnabled=false',
              "/p:PackageCertificatePassword=$env:PFX_PASSWORD",
              "/p:AppxPackageDir=$appxPackageDir\",
              '/p:CL_MPCount=2',
              '/m:2',
              '/nr:false'
          )
          & msbuild @arguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Run TerminalCore unit tests
        shell: pwsh
        run: |
          ./build/scripts/Run-Tests.ps1 `
              -MatchPattern 'Terminal.Core.Unit.Tests.dll' `
              -Platform x64 `
              -Configuration Release `
              -Root ./bin/x64/Release `
              -LogPath ./artifacts/terminal-core-tests.wtl

      - name: Create and sign MSIX bundle
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem artifacts/AppPackages -Recurse -Filter 'CascadiaPackage*.msix' -File)
          if ($packages.Count -ne 1) {
              throw "Expected exactly one CascadiaPackage MSIX, found $($packages.Count)."
          }
          $bundle = "artifacts/release/WindowsTerminalPersonal_$env:PACKAGE_VERSION`_x64.msixbundle"
          ./build/scripts/Create-AppxBundle.ps1 `
              -InputPath artifacts/AppPackages `
              -ProjectName CascadiaPackage `
              -BundleVersion $env:PACKAGE_VERSION `
              -OutputPath $bundle
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" |
              Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          & $signTool sign /fd SHA256 /f src/cascadia/CascadiaPackage/CascadiaPackage_TemporaryKey.pfx /p $env:PFX_PASSWORD $bundle
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Authenticode reports a self-signed certificate as untrusted even when the
          # embedded signature is intact. Validate the signature and signer without
          # adding the certificate to the Root store (which can prompt and hang CI).
          $signature = Get-AuthenticodeSignature $bundle
          $expectedCert = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
              'src/cascadia/CascadiaPackage/CascadiaPackage_TemporaryKey.pfx',
              $env:PFX_PASSWORD)
          if (-not $signature.SignerCertificate -or
              $signature.SignerCertificate.Thumbprint -ne $expectedCert.Thumbprint) {
              throw 'The bundle was not signed by the expected nightly certificate.'
          }
          if ($signature.Status -in @('NotSigned', 'HashMismatch', 'NotSupported')) {
              throw "Bundle signature validation failed: $($signature.StatusMessage)"
          }
          Write-Host "Bundle signature is intact and uses the expected signer ($($signature.Status))."

          # Enforce the package identity that permits in-place App Installer updates.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $inspectionRoot = Join-Path $env:RUNNER_TEMP 'terminal-package-inspection'
          $bundleRoot = Join-Path $inspectionRoot 'bundle'
          $packageRoot = Join-Path $inspectionRoot 'package'
          Remove-Item $inspectionRoot -Recurse -Force -ErrorAction Ignore
          [IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path $bundle), $bundleRoot)

          [xml]$bundleManifest = Get-Content (Join-Path $bundleRoot 'AppxMetadata/AppxBundleManifest.xml')
          $bundleIdentity = $bundleManifest.Bundle.Identity
          if ($bundleIdentity.Name -ne 'Wilt.WindowsTerminalPersonal' -or
              $bundleIdentity.Publisher -ne 'CN=wilt00' -or
              $bundleIdentity.Version -ne $env:PACKAGE_VERSION) {
              throw "Unexpected bundle identity: $($bundleIdentity.Name), $($bundleIdentity.Publisher), $($bundleIdentity.Version)"
          }

          $innerPackages = @(Get-ChildItem $bundleRoot -Filter '*.msix' -File)
          if ($innerPackages.Count -ne 1) {
              throw "Expected one package in the bundle, found $($innerPackages.Count)."
          }
          [IO.Compression.ZipFile]::ExtractToDirectory($innerPackages[0].FullName, $packageRoot)
          [xml]$packageManifest = Get-Content (Join-Path $packageRoot 'AppxManifest.xml')
          $identity = $packageManifest.Package.Identity
          if ($identity.Name -ne 'Wilt.WindowsTerminalPersonal' -or
              $identity.Publisher -ne 'CN=wilt00' -or
              $identity.Version -ne $env:PACKAGE_VERSION -or
              $identity.ProcessorArchitecture -ne 'x64') {
              throw "Unexpected package identity: $($identity.Name), $($identity.Publisher), $($identity.Version), $($identity.ProcessorArchitecture)"
          }
          $xaml = @($packageManifest.Package.Dependencies.PackageDependency | Where-Object Name -eq 'Microsoft.UI.Xaml.2.8')
          if ($xaml.Count -ne 1 -or [version]$xaml[0].MinVersion -gt [version]'8.2310.30001.0') {
              throw 'The package has an unexpected Microsoft.UI.Xaml.2.8 dependency.'
          }

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-test-results-${{ needs.sync.outputs.package_version }}
          path: artifacts/terminal-core-tests.wtl
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish versioned prerelease
        shell: pwsh
        run: |
          $tag = "nightly-v$env:PACKAGE_VERSION"
          $notes = @"
          Install through the stable [App Installer feed](https://wilt-manifests.val.run/windows-terminal.appinstaller) to receive automatic updates.
          "@
          gh release create $tag artifacts/release/* `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:PERSONAL_SHA `
              --title "Windows Terminal Personal $env:PACKAGE_VERSION" `
              --notes $notes `
              --prerelease

      - name: Publish App Installer feed
        shell: pwsh
        run: |
          $tag = "nightly-v$env:PACKAGE_VERSION"
          $bundleName = "WindowsTerminalPersonal_$env:PACKAGE_VERSION`_x64.msixbundle"
          $feedUri = 'https://wilt-manifests.val.run/windows-terminal.appinstaller'
          $bundleUri = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$bundleName"
          $appInstallerPath = 'WindowsTerminalPersonal.appinstaller'

          @"
          <?xml version="1.0" encoding="utf-8"?>
          <AppInstaller
            xmlns="http://schemas.microsoft.com/appx/appinstaller/2018"
            Version="$env:PACKAGE_VERSION"
            Uri="$feedUri">

            <MainBundle
              Name="Wilt.WindowsTerminalPersonal"
              Publisher="CN=wilt00"
              Version="$env:PACKAGE_VERSION"
              Uri="$bundleUri" />

            <Dependencies>
              <Package
                Name="Microsoft.UI.Xaml.2.8"
                Publisher="CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US"
                Version="8.2310.30001.0"
                ProcessorArchitecture="x64"
                Uri="https://github.com/microsoft/microsoft-ui-xaml/releases/download/v2.8.6/Microsoft.UI.Xaml.2.8.x64.appx" />
            </Dependencies>

            <UpdateSettings>
              <OnLaunch
                HoursBetweenUpdateChecks="12"
                ShowPrompt="false"
                UpdateBlocksActivation="false" />
              <AutomaticBackgroundTask />
              <ForceUpdateFromAnyVersion>true</ForceUpdateFromAnyVersion>
            </UpdateSettings>
          </AppInstaller>
          "@ | Set-Content $appInstallerPath -Encoding utf8NoBOM

          [xml]$feed = Get-Content $appInstallerPath
          if ($feed.AppInstaller.Version -ne $env:PACKAGE_VERSION -or
              $feed.AppInstaller.MainBundle.Name -ne 'Wilt.WindowsTerminalPersonal' -or
              $feed.AppInstaller.MainBundle.Publisher -ne 'CN=wilt00' -or
              $feed.AppInstaller.MainBundle.Version -ne $env:PACKAGE_VERSION -or
              $feed.AppInstaller.MainBundle.Uri -ne $bundleUri) {
              throw 'Generated App Installer feed failed invariant validation.'
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $appInstallerPath
          git commit -m "Update App Installer feed to $env:PACKAGE_VERSION"
          git push origin HEAD:personal
